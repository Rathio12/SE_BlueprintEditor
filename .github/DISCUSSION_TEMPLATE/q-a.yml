title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Ask anything about using SE Blueprint Inspector. The [wiki](https://rathio12.github.io/SE_BlueprintEditor/wiki/Home.html) and its [FAQ](https://rathio12.github.io/SE_BlueprintEditor/wiki/FAQ.html) answer the most common questions.
        Found a bug instead? Please use a [bug report](https://github.com/Rathio12/SE_BlueprintEditor/issues/new/choose).
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Windows app
        - Website
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Bottom right of the app window. Skip for the website.
      placeholder: "1.2.1"
