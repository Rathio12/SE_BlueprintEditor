name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/*.md'
      - 'tools/sync-wiki.ps1'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs/wiki to the GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.wiki.git" wiki-repo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::The GitHub wiki doesn't exist yet. Save the first page once at /wiki/_new, then re-run this workflow."
            exit 0
          }
          ./tools/sync-wiki.ps1 -Target wiki-repo
          Set-Location wiki-repo
          git config user.name "Rathio12"
          git config user.email "146424297+Rathio12@users.noreply.github.com"
          git add -A
          if (-not (git status --porcelain)) { Write-Host "Wiki already up to date"; exit 0 }
          git commit -m "docs: sync wiki from docs/wiki ($($env:GITHUB_SHA.Substring(0,7)))"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
          git push
          if ($LASTEXITCODE -ne 0) { throw "git push failed" }
